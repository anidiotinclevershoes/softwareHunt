name: Creative Margin proof checks
on:
  push:
    branches:
      - prototype/creative-margin-proof-v1
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic tests
        run: python -m unittest discover -s prototypes/creative-margin/proof -p 'test_*.py' -v
      - name: Generate sample review
        run: python prototypes/creative-margin/proof/generate_report.py
      - name: Upload review
        uses: actions/upload-artifact@v4
        with:
          name: creative-margin-sample-review
          path: prototypes/creative-margin/proof/SAMPLE_REVIEW.md
